<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dragon Legend</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(circle at 50% 40%, #1b2233, #07090d 70%); color: #f2f2f2; font: 600 22px system-ui, sans-serif; letter-spacing: .08em; }
    #loading small { font-weight: 400; font-size: 13px; opacity: .6; letter-spacing: .02em; }
    .loading-orb { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, #ffb02e 30%, #e06a0a 75%);
      box-shadow: 0 0 40px #ff9a1f88; animation: orb 1.4s ease-in-out infinite; }
    @keyframes orb { 50% { transform: scale(1.08); box-shadow: 0 0 60px #ffb02ecc; } }
  </style>
  <!-- dev only: the build bundles three and drops this map -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="loading"><div class="loading-orb"></div><div>Dragon Legend</div><small>Building the world…</small></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
