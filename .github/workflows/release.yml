# Builds the Godot game for every platform when a release is published (or on demand for a tag) and attaches the
# files to that release. File names never change, so
# https://github.com/laibaminhvuong-ux/dragon-legend/releases/latest/download/<file> is always the newest and the
# download page in docs/ links there:
#   Dragon-Legend-Setup.exe (Windows installer), Dragon-Legend-windows.zip, Dragon-Legend-mac.zip (universal),
#   Dragon-Legend-linux.x86_64, Dragon-Legend-android.apk, and the update packs Dragon-Legend.pck (Windows/Linux),
#   Dragon-Legend-mac.pck and Dragon-Legend-android.pck that installed games download by themselves (godot/core/updater.gd).
name: Build downloads
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the downloads to, e.g. v0.0.3 (built from the selected branch)"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GODOT: "4.7.2"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # only what Godot's Android export needs (the default list asks for the removed "tools" package and fails)
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"
      - name: Godot and export templates
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip"
          curl -sSLo templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q -j templates.tpz -d ~/.local/share/godot/export_templates/${GODOT}.stable
      - name: Version from the tag
        run: |
          V="${TAG#v}"
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" godot/project.godot
          sed -i "s/^const VERSION := .*/const VERSION := \"$V\"/" godot/core/version.gd
          sed -i "s/^version\/name=.*/version\/name=\"$V\"/; s/^application\/short_version=.*/application\/short_version=\"$V\"/; s/^application\/version=.*/application\/version=\"$V\"/" godot/export_presets.cfg
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
      - name: Android signing key
        run: |
          # Use the same key every release (secret ANDROID_KEYSTORE_B64 = base64 of a keystore with alias "dragonlegend"),
          # so a new APK installs over the old one. Without it a fresh key is made (in-game .pck updates still work).
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias dragonlegend -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dragonlegend' }}" -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dragonlegend' }}" -dname "CN=Dragon Legend"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=dragonlegend" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'dragonlegend' }}" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Export every platform
        run: |
          mkdir -p build/windows build/linux build/mac build/android build/patch out
          godot --headless --path godot --import || true
          godot --headless --path godot --export-release "Windows Desktop"
          godot --headless --path godot --export-release "Linux"
          godot --headless --path godot --export-release "macOS"
          godot --headless --path godot --export-release "Android"
          godot --headless --path godot --export-pack "Patch PCK" ../build/patch/Dragon-Legend.pck
          godot --headless --path godot --export-pack "Android" ../build/patch/Dragon-Legend-android.pck
          godot --headless --path godot --export-pack "macOS" ../build/patch/Dragon-Legend-mac.pck
          (cd build/windows && zip -q ../../out/Dragon-Legend-windows.zip "The Dragon Legend.exe")
          cp build/linux/dragon-legend.x86_64 out/Dragon-Legend-linux.x86_64
          cp build/mac/Dragon-Legend-mac.zip build/android/Dragon-Legend-android.apk build/patch/*.pck out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/The Dragon Legend.exe
      - name: Attach to the release
        run: gh release upload "$TAG" out/* --clobber

  installer:
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: build/windows
      - name: Build the installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DVERSION=${TAG#v}" tools/installer.iss
          gh release upload "$TAG" build/installer/Dragon-Legend-Setup.exe --clobber
