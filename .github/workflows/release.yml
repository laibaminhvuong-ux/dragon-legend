# Builds the app for every platform when a release is published (or on demand for a tag) and attaches the
# files to that release: Windows installer + portable zip (+ latest.yml for auto-update), Mac (universal dmg),
# Linux AppImage and an Android APK. File names never change, so
# https://github.com/laibaminhvuong-ux/dragon-legend/releases/latest/download/<file> is always the newest,
# and the download page in docs/ links there.
name: Build downloads
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the downloads to, e.g. v0.0.1 (built from the selected branch)"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the game
        shell: bash
        run: |
          npm install -g esbuild@0.24.0
          ESBUILD=esbuild python tools/build_site.py
          rm -rf desktop/site && cp -r dist/site desktop/site
      - name: Build the app
        shell: bash
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          case "$RUNNER_OS" in
            macOS) npx electron-builder --mac --publish never ;;
            Linux) npx electron-builder --linux --publish never ;;
            Windows) npx electron-builder --win --x64 --publish never ;;
          esac
      - name: Attach to the release
        shell: bash
        run: |
          files=$(ls desktop/release/Dragon-Legend-* desktop/release/latest*.yml 2>/dev/null | grep -E '\.(exe|zip|dmg|AppImage|yml|blockmap)$')
          gh release upload "$TAG" $files --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the game
        run: |
          npm install -g esbuild@0.24.0
          ESBUILD=esbuild python tools/build_site.py
      - name: Build the APK
        working-directory: mobile
        run: |
          rm -rf www && cp -r ../dist/site www
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # launcher icon: the game's emblem instead of Capacitor's default
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp ../web/icons/icon-192.png "$d/$n.png"; done; done
          # landscape, full screen
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          cd android
          sed -i "s/versionName \".*\"/versionName \"${TAG#v}\"/" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Dragon-Legend-android.apk"
      - name: Attach to the release
        run: gh release upload "$TAG" "Dragon-Legend-android.apk" --clobber
