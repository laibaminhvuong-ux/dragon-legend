<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="0.35" stop-color="#ffa62b"/><stop offset="0.78" stop-color="#ef7512"/><stop offset="1" stop-color="#bf4a0a"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf0"/><stop offset="0.5" stop-color="#fff3b0" stop-opacity=".8"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#ff7a1a" stop-opacity="0"/><stop offset="0.8" stop-color="#ff8a2a" stop-opacity=".6"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
