  <path d="M 256.0 150.0 Q 268.7 194.1 284.2 223.2 Q 316.6 229.0 362.5 227.4 Q 324.5 253.1 301.7 276.8 Q 306.2 309.4 321.8 352.6 Q 285.6 324.4 256.0 310.0 Q 226.4 324.4 190.2 352.6 Q 205.8 309.4 210.3 276.8 Q 187.5 253.1 149.5 227.4 Q 195.4 229.0 227.8 223.2 Q 243.3 194.1 256.0 150.0 Z" fill="url(#fstar)" stroke="#6e0c06" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="256.0,206.0 270.1,242.6 309.3,244.7 278.8,269.4 288.9,307.3 256.0,286.0 223.1,307.3 233.2,269.4 202.7,244.7 241.9,242.6" fill="#ffb36a" opacity=".45"/>
